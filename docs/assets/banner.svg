<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Codex Doctor banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.55" stop-color="#122b2a"/>
      <stop offset="1" stop-color="#0f3d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="70" y="68" width="1060" height="284" rx="22" fill="#0b1117" opacity="0.88" filter="url(#shadow)"/>
  <rect x="104" y="104" width="430" height="214" rx="14" fill="#101a21" stroke="#244a47"/>
  <text x="132" y="150" fill="#6ee7c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">$ codex-doctor watch</text>
  <text x="132" y="195" fill="#e5f7f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Status: TOOL_RUNNING</text>
  <text x="132" y="235" fill="#b8d8d2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Confidence: HIGH</text>
  <text x="132" y="275" fill="#89aaa4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Network: reachable, 401 in 0.44s</text>
  <text x="590" y="164" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700">Codex Doctor</text>
  <text x="594" y="214" fill="#b8d8d2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Know why Codex is thinking.</text>
  <text x="594" y="265" fill="#7ddfc8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Local-first diagnostics for network, API, tools, approvals, context, and sandbox waits.</text>
