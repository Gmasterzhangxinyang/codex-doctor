<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Codex Doctor session health banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071015"/>
      <stop offset="0.48" stop-color="#0d2327"/>
      <stop offset="1" stop-color="#12352f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#6ee7c8"/>
      <stop offset="1" stop-color="#8ab4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <path d="M0 340 C180 280 320 390 520 328 C730 262 860 302 1200 218 L1200 420 L0 420 Z" fill="#0a171d" opacity="0.72"/>
  <rect x="64" y="54" width="1072" height="312" rx="28" fill="#0b1218" opacity="0.92" filter="url(#shadow)"/>

  <rect x="96" y="88" width="500" height="244" rx="14" fill="#0f1a21" stroke="#284741"/>
  <circle cx="124" cy="116" r="7" fill="#ff6b6b"/>
  <circle cx="148" cy="116" r="7" fill="#ffd166"/>
  <circle cx="172" cy="116" r="7" fill="#5ee6a8"/>
  <text x="118" y="158" fill="#6ee7c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">$ codex-doctor</text>
  <text x="118" y="198" fill="#edf7f4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">Visible state: TOOL_RUNNING</text>
  <text x="118" y="232" fill="#b8d8d2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">Evidence: 2 open tool calls</text>
  <text x="118" y="265" fill="#b8d8d2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">Latest event: 8s ago</text>
  <text x="118" y="298" fill="#8ab4ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">Network: reachable</text>

  <text x="646" y="144" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="750">Codex Doctor</text>
  <text x="650" y="192" fill="#d8eee8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Session health, not mind reading.</text>
  <rect x="650" y="224" width="390" height="4" rx="2" fill="url(#line)"/>
  <text x="650" y="270" fill="#9fc7c0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Local-first evidence for tools, approvals,</text>
  <text x="650" y="302" fill="#9fc7c0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">network probes, sandbox errors, and event age.</text>
</svg>
