[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-doctor"
version = "0.4.0"
description = "One-shot local diagnosis for why Codex appears stuck: network, API, tools, approval, sandbox, or commands."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Xinyang Zhang" }
]
keywords = ["codex", "openai", "observability", "developer-tools", "ai-agent", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Bug Tracking",
  "Typing :: Typed"
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "platformdirs>=4.2.0"
]

[project.urls]
Homepage = "https://github.com/Gmasterzhangxinyang/codex-doctor"
Repository = "https://github.com/Gmasterzhangxinyang/codex-doctor"
Issues = "https://github.com/Gmasterzhangxinyang/codex-doctor/issues"
Changelog = "https://github.com/Gmasterzhangxinyang/codex-doctor/blob/main/CHANGELOG.md"

[project.scripts]
codex-doctor = "codex_doctor.cli:app"
codex-doctor-hook = "codex_doctor.hook_recorder:main"

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy"
]

[tool.setuptools.package-data]
codex_doctor = ["py.typed"]

[tool.setuptools.packages.find]
include = ["codex_doctor*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["codex_doctor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
